name: Setup JS
description: Node from .nvmrc, npm ci, and a CI .env from the example file.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install JS dependencies
      shell: bash
      run: npm ci
    - name: Materialize env
      shell: bash
      run: cp .env.example .env
